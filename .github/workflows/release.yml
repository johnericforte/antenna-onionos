name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Cross-compile for ARMv7
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: |
          go build -buildvcs=false -trimpath -mod=readonly \
            -ldflags='-s -w -buildid=' \
            -o App/Antenna/antenna .

      - name: Verify the binary is static ARM
        run: |
          file App/Antenna/antenna
          file App/Antenna/antenna | grep -q "ARM"
          file App/Antenna/antenna | grep -q "statically linked"

      - name: Package
        run: |
          chmod 0755 App/Antenna/antenna App/Antenna/launch.sh
          cd App && zip -r ../Antenna.zip Antenna

      - uses: actions/upload-artifact@v7
        with:
          name: Antenna
          path: Antenna.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Antenna.zip

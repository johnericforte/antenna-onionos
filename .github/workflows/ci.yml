name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Tests
        run: go test ./...

      - name: No third-party modules
        run: |
          modules=$(go list -m all | tail -n +2)
          if [ -n "$modules" ]; then
            echo "This project must stay dependency-free, but found:"
            echo "$modules"
            exit 1
          fi

      - name: Cross-compile for the device
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: |
          go build -buildvcs=false -trimpath -mod=readonly \
            -ldflags='-s -w -buildid=' \
            -o App/Antenna/antenna .
          file App/Antenna/antenna
          file App/Antenna/antenna | grep -q "ARM"
          file App/Antenna/antenna | grep -q "statically linked"

      - name: Shipped scripts must be LF
        run: |
          if grep -qU $'\r' App/Antenna/launch.sh; then
            echo "launch.sh contains CRLF; it will not execute on the Miyoo."
            exit 1
          fi
